<!DOCTYPE html>
<html>
<head>
  <title>Lab Control - Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background-color: #3a2d3c;
      color: #dfd0e2;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    a {
      color: #e5b060;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .dashboard {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      align-items: flex-start;
    }
    .dashboard-left {
      width: 48%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 42px; 
    }
    .dashboard-right {
      width: 52%;
    }
    .motors-container {
      display: flex;
      gap: 10px;
    }
    .motor-box {
      flex: 1;
    }
    .panel {
      background: #4a3b4c;
      padding: 15px;
      border: 1px solid #5a4b5c;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }
    .panel h1, .panel h3 {
      color: #e5b060;
      margin-top: 0;
      border-bottom: 1px solid #5a4b5c;
      padding-bottom: 6px;
      font-size: 1.05em;
    }
    .status-line {
      font-size: 0.9em;
      color: #bfaabf;
      margin: 6px 0;
    }
    .status-badge {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75em;
      font-weight: bold;
    }
    .status-badge.idle { background: #3a2d3c; color: #8e7a90; }
    .status-badge.running { background: #507ea4; color: #ffffff; }
    .status-badge.paused { background: #b08050; color: #ffffff; }

    select, input {
      width: 100%;
      padding: 7px;
      margin-top: 3px;
      margin-bottom: 8px;
      background: #3a2d3c;
      border: 1px solid #5a4b5c;
      color: #dfd0e2;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 0.9em;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 3px;
      cursor: pointer;
      background-color: #507ea4;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9em;
    }
    button:hover { background-color: #40688c; }
    .btn-neutral { background-color: #705b73; color: #ffffff; }
    .btn-neutral:hover { background-color: #5e4c61; }
    .btn-stop { background-color: #a45050; color: #ffffff; }
    .btn-stop:hover { background-color: #8c4040; }
    .btn-success { background-color: #6a9a60; color: #ffffff; }
    .btn-success:hover { background-color: #57804f; }

    .compact-panel {
      background: #3a2d3c;
      border: 1px solid #5a4b5c;
      border-radius: 5px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }
    .compact-panel h3 {
      margin-top: 0;
      font-size: 0.85em;
      border-bottom: 1px solid #4a3b4c;
      padding-bottom: 4px;
      margin-bottom: 6px;
      color: #e5b060;
    }
    .compact-input {
      width: 55px !important;
      padding: 2px 4px !important;
      font-size: 0.8em !important;
      margin: 0 !important;
      display: inline-block;
    }
    .compact-btn {
      width: auto !important;
      padding: 3px 8px !important;
      font-size: 0.75em !important;
      margin: 0 !important;
      display: inline-block;
    }
  </style>
</head>
<body>

  <p style="margin-bottom: 16px;">
    <a href="/motors.html">Detailed Motor Controls</a> |
    <a href="/camera.html">Detailed Camera Controls</a>
  </p>

  <div class="dashboard">

    <div class="dashboard-left">

      <div class="motors-container">
        
        <div class="panel motor-box">
          <h1>Motor 1</h1>
          <p class="status-line">Pos: <strong id="pos1" style="color:#dfd0e2;">--</strong> mm</p>
          <p class="status-line">Status: <span id="seqBadge1" class="status-badge idle">idle</span></p>

          <button onclick="home(1)">Home</button>
          <button class="btn-neutral" onclick="pauseMotor(1)">Pause</button>
          <button class="btn-neutral" onclick="resumeMotor(1)">Resume</button>
          <button class="btn-stop" onclick="stopMotor(1)">Stop</button>
        </div>

        <div class="panel motor-box">
          <h1>Motor 2</h1>
          <p class="status-line">Pos: <strong id="pos2" style="color:#dfd0e2;">--</strong> mm</p>
          <p class="status-line">Status: <span id="seqBadge2" class="status-badge idle">idle</span></p>

          <button onclick="home(2)">Home</button>
          <button class="btn-neutral" onclick="pauseMotor(2)">Pause</button>
          <button class="btn-neutral" onclick="resumeMotor(2)">Resume</button>
          <button class="btn-stop" onclick="stopMotor(2)">Stop</button>
        </div>

      </div>

      <div class="panel">
        <h1>Global Actions</h1>
        <div style="display: flex; gap: 8px;">
          <button class="btn-neutral" onclick="pauseBoth()">Pause Both</button>
          <button class="btn-neutral" onclick="resumeBoth()">Resume Both</button>
          <button class="btn-stop" onclick="stopBoth()">Stop Both</button>
        </div>

        <h3 style="margin-top: 12px; color: #e5b060;">Run Sequence (Both Motors)</h3>
        <select id="globalSeqSelect">
            <option value="">-- Loading Sequences --</option>
        </select>
        <button onclick="runGlobalSequence()">Execute on Both Motors</button>
        <p id="globalSeqStatus" style="font-size: 0.85em; margin-top: 5px; color: #e5b060;"></p>
      </div>

    </div>

    <div class="dashboard-right">
      <div class="panel">
        <h2 style="margin: 0; color: #e5b060; font-size: 1.1em; border-bottom: 1px solid #5a4b5c; padding-bottom: 6px; margin-bottom: 8px;">Live Feed</h2>
        
        <div class="video-wrapper" style="width: 100%; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden; border-radius: 6px; border: 1px solid #5a4b5c;">
          <img id="videoFeed" src="/video_feed?t=no-cache" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;">
          <canvas id="measureCanvas" width="1024" height="768" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair;"></canvas>
        </div>

        <div style="display: flex; gap: 12px; align-items: stretch; margin-top: 12px;">
          
          <div class="compact-panel" style="flex: 2;">
            <h3>Measurement</h3>
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
              <label style="font-size: 0.8em; margin: 0;">Zoom:</label>
              <select id="zoomSelect" class="compact-input" onchange="updateMeasurementDisplay()">
                <option value="1x">1x</option>
                <option value="2x">2x</option>
                <option value="3x">3x</option>
                <option value="4x">4x</option>
              </select>
              <button class="compact-btn" style="background-color: #a45050;" onclick="clearCanvasLines()">Clear</button>
            </div>
            <p id="measurementResult" style="font-size: 0.75em; margin: auto 0 0 0; background: #2c222e; padding: 4px; border-radius: 3px; color: #e5b060; text-align: center; border: 1px solid #4a3b4c; min-height: 16px;"></p>
          </div>

          <div class="compact-panel" style="flex: 1; align-items: center; justify-content: center;">
            <h3 style="width: 100%; text-align: left;">Quick Capture</h3>
            <button class="btn-success compact-btn" style="width: 100% !important; padding: 6px !important; font-size: 0.85em !important;" onclick="captureImage()">Capture Image</button>
            <p id="captureStatus" style="font-size: 0.7em; margin: 4px 0 0 0; color: #e5b060;"></p>
          </div>

        </div>

      </div>
    </div>

  </div>

  <script>
    async function home(motorNum) { await fetch(`/motor${motorNum}/home`, { method: "POST" }); }
    async function stopMotor(motorNum) { await fetch(`/motor${motorNum}/stop`, { method: "POST" }); }
    async function pauseMotor(motorNum) { await fetch(`/motor${motorNum}/pause`, { method: "POST" }); }
    async function resumeMotor(motorNum) { await fetch(`/motor${motorNum}/resume`, { method: "POST" }); }

    async function pauseBoth() {
      await Promise.all([ fetch("/motor1/pause", { method: "POST" }), fetch("/motor2/pause", { method: "POST" }) ]);
    }
    async function resumeBoth() {
      await Promise.all([ fetch("/motor1/resume", { method: "POST" }), fetch("/motor2/resume", { method: "POST" }) ]);
    }
    async function stopBoth() {
      await Promise.all([ fetch("/motor1/stop", { method: "POST" }), fetch("/motor2/stop", { method: "POST" }) ]);
    }

    let availableSequences = {};
    async function loadGlobalSequences() {
      try {
        const res = await fetch("/sequences");
        availableSequences = await res.json();
        const select = document.getElementById("globalSeqSelect");
        select.innerHTML = '<option value="">-- Select a Sequence --</option>';
        Object.keys(availableSequences).forEach(name => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
      } catch (err) { console.error(err); }
    }
    loadGlobalSequences();

    async function runGlobalSequence() {
      const select = document.getElementById("globalSeqSelect");
      const statusEl = document.getElementById("globalSeqStatus");
      const name = select.value;
      if (!name) { statusEl.textContent = "Please select a sequence."; return; }
      const steps = availableSequences[name];
      statusEl.textContent = `Running '${name}'...`;
      try {
        await fetch("/sequence/run_both", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ motor1_steps: steps, motor2_steps: steps })
        });
        statusEl.textContent = "Command sent.";
        setTimeout(() => statusEl.textContent = "", 3000);
      } catch (err) { statusEl.textContent = `Error: ${err.message}`; }
    }

    async function pollStatus() {
      try {
        const [res1, res2] = await Promise.all([fetch("/motor1/status"), fetch("/motor2/status")]);
        applyStatus(1, await res1.json());
        applyStatus(2, await res2.json());
      } catch (e) {}
    }

    function applyStatus(motorNum, data) {
      document.getElementById(`pos${motorNum}`).textContent = data.position.toFixed(2);
      const badge = document.getElementById(`seqBadge${motorNum}`);
      if (data.running && data.paused) {
        badge.textContent = "paused"; badge.className = "status-badge paused";
      } else if (data.running) {
        badge.textContent = "running"; badge.className = "status-badge running";
      } else {
        badge.textContent = "idle"; badge.className = "status-badge idle";
      }
    }
    setInterval(pollStatus, 1000);
    pollStatus();

    async function captureImage() {
      const statusEl = document.getElementById("captureStatus");
      statusEl.textContent = "Capturing...";
      const res = await fetch("/camera/capture", { method: "POST" });
      const data = await res.json();
      statusEl.textContent = data.error ? data.error : `Saved: ${data.filename}`;
    }

    const canvas = document.getElementById("measureCanvas");
    const ctx = canvas.getContext("2d");
    let drawing = false, startPoint = null, lastLine = null;
    
    // Hardcoded defaults matching your specified values
    let calibrationData = {
      "1x": 1.1152,
      "2x": 0.5984,
      "3x": 0.3973,
      "4x": 0.28655
    };
    
    async function loadCalibration() {
      try {
        const res = await fetch("/calibration");
        const backendData = await res.json();
        if (backendData && Object.keys(backendData).length > 0) {
          calibrationData = { ...calibrationData, ...backendData };
        }
      } catch (e) {}
      updateMeasurementDisplay();
    }
    loadCalibration();

    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (lastLine) {
        ctx.strokeStyle = "rgba(80, 126, 164, 0.7)"; 
        ctx.lineWidth = 4;
        ctx.beginPath(); 
        ctx.moveTo(lastLine.x1, lastLine.y1); 
        ctx.lineTo(lastLine.x2, lastLine.y2); 
        ctx.stroke();
      }
    }

    function clearCanvasLines() {
      lastLine = null;
      redrawAll();
      document.getElementById("measurementResult").textContent = "";
    }

    canvas.addEventListener("mousedown", (e) => {
      drawing = true;
      const rect = canvas.getBoundingClientRect();
      startPoint = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    });
    canvas.addEventListener("mousemove", (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const current = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(106, 154, 96, 0.7)"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(startPoint.x, startPoint.y); ctx.lineTo(current.x, current.y); ctx.stroke();
    });
    canvas.addEventListener("mouseup", (e) => {
      if (!drawing) return;
      drawing = false;
      const rect = canvas.getBoundingClientRect();
      const endPoint = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      lastLine = { x1: startPoint.x, y1: startPoint.y, x2: endPoint.x, y2: endPoint.y, pixelLength: Math.hypot(endPoint.x - startPoint.x, endPoint.y - startPoint.y) };
      redrawAll();
      updateMeasurementDisplay();
    });
    function updateMeasurementDisplay() {
      const resultEl = document.getElementById("measurementResult");
      if (!lastLine) {
        resultEl.textContent = "";
        return;
      }
      const zoom = document.getElementById("zoomSelect").value;
      const mp = calibrationData[zoom];
      if (mp) resultEl.textContent = `Length: ${(lastLine.pixelLength * mp).toFixed(2)} μm`;
      else resultEl.textContent = `Length: ${lastLine.pixelLength.toFixed(1)} px (No cal)`;
    }
  </script>
</body>
</html>
